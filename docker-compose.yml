version: '3.8'

services:
  app:
    build: .
    container_name: subscription-tracker-app
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    # Since we are using an external MongoDB Atlas, we don't need a mongo service here.
    # But this compose file makes it easy to add one later if needed!
